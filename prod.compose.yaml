services:
  ultra-coins-blog:
    image: ghcr.io/ultra-coins/ultra-coins-blog/blog:main
    container_name: ultra-coins-blog
    labels:
      traefik.enable: true
      traefik.http.routers.ultra-coins-blog.priority: 2
      traefik.http.routers.ultra-coins-blog.rule: "Host(`ultra.coins.tsukuba.ac.jp`) && PathPrefix(`/blog`)"
      traefik.http.services.ultra-coins-blog.loadbalancer.server.port: 80
      traefik.http.routers.ultra-coins-blog.entrypoints: websecure
      traefik.http.routers.ultra-coins-blog.tls: true
      #* Remove prefix from /blog to /
      # create a middleware named `remove-prefix-blog`
      traefik.http.middlewares.remove-prefix-blog.stripprefix.prefixes: /blog
      # apply the middleware named `remove-prefix-blog`
      traefik.http.routers.ultra-coins-blog.middlewares: remove-prefix-blog@docker
    restart: always
    networks:
      - traefik

networks:
  traefik:
    external: true
